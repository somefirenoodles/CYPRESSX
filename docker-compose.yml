services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in the local .env file}
      APP_USER: CYPRESSX_APP
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:1887:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    shm_size: 1gb

  app:
    build: .
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      PORT: 3001
      DB_USER: CYPRESSX_APP
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local .env file}
      DB_CONNECT_STRING: oracle:1521/FREEPDB1
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "3000:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  oracle-data:
